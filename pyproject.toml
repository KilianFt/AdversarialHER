[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial_her"
version = "0.1.0"
description = "Dual-Mode Adversarial Hindsight Experience Replay with RLPD on Multi-Agent Safety Gym"
authors = [{ name = "Tamino" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=0.28.0",
    "mujoco>=2.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
    "wandb",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "models*", "replay*"]
exclude = ["tests*", "logs*", "wandb*", "configs*", "checkpoints*", "eval_results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

